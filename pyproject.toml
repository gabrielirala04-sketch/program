[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingenieria-lab"
version = "0.2.0"
description = "Laboratorio de ingeniería modular y local"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "PySide6>=6.8,<7", "pyqtgraph>=0.13,<0.15", "scipy>=1.14,<2", "sympy>=1.13,<2"]

[project.optional-dependencies]
science = ["scipy>=1.14", "sympy>=1.13"]
dev = ["pytest>=8"]

[project.scripts]
ingenieria-lab = "ingenieria_lab.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
